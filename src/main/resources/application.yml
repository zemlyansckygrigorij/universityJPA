      host: localhost
      port: 6379
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/university
    username: postgres
    password: rfnfdfcbz123!
  jpa:
    hibernate:
      ddl-auto: update
## Prometheus
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metric # Включить конечные точки Prometheus
  metrics:
    export:
      prometheus:
        enabled: true # Включить экспорт prometheus
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true # включить гистограмму на основе процентилей для http запросов
      sla:
        http:
          server:
            requests: 100 мс, 150 мс, 250 мс, 500 мс, 1 с
    enable:
      jvm: true